# Checks pull requests; builds and deploys https://fctl.sh from main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # fctl's docs changed (also possible by pushing a new fctl-docs.ref).
  repository_dispatch:
    types: [fctl-docs]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://fctl.sh
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Deploy
        run: npx --yes wrangler@4.151.1 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The AI Search instance the Worker searches (fctl-docs): the docs' new and
      # changed sections in, the ones they no longer have out.
      - name: Sync search
        run: node scripts/search-sync.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: |
          curl -fsS https://fctl.sh/ | grep -q "<title>fctl"
          curl -fsS https://fctl.sh/install | head -1 | grep -q "^#!/bin/sh"
          curl -fsS -o /dev/null https://fctl.sh/docs/getting-started/
          curl -fsS -o /dev/null https://fctl.sh/llms.txt
          curl -fsS -o /dev/null https://fctl.sh/docs/getting-started.md
          curl -fsS https://fctl.sh/docs/search/ | grep -q "Search the docs"
          # One full search (cached for a day after): it answers, and its limits and AI Search work.
          curl -fsS "https://fctl.sh/api/search?q=install%20the%20cli" > search.json
          grep -q '"hits":\[{' search.json
          if grep -q '"notice":"unavailable"' search.json; then cat search.json; exit 1; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' https://www.fctl.sh/)" = 301
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://fctl.sh/docs/)" = https://fctl.sh/docs/
